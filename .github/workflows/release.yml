name: Release NTX Server

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or version for the release (e.g. v0.1.0)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build-server-linux:
    name: Build Linux Server (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            use_cross: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for aarch64)
        if: matrix.use_cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross --locked || cargo install cross --locked

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p ntx-server
          else
            cargo build --release --target ${{ matrix.target }} -p ntx-server
          fi

      - name: Strip binary
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/ntx-server"
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq binutils-aarch64-linux-gnu
            aarch64-linux-gnu-strip "$BIN_PATH"
          else
            strip "$BIN_PATH"
          fi
          ls -lh "$BIN_PATH"

      - name: Package tarball
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/ntx-server package/
          cp scripts/install.sh package/
          cp scripts/uninstall.sh package/
          chmod +x package/*
          tar -czf "ntx-server-linux-${{ matrix.arch }}.tar.gz" -C package ntx-server install.sh uninstall.sh
          ls -lh "ntx-server-linux-${{ matrix.arch }}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ntx-server-linux-${{ matrix.arch }}
          path: ntx-server-linux-${{ matrix.arch }}.tar.gz

  create-release:
    name: Publish GitHub Release
    needs: build-server-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: |
          ls -lh artifacts/
          cp scripts/install.sh artifacts/
          cp scripts/uninstall.sh artifacts/
          ls -lh artifacts/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            artifacts/ntx-server-linux-x86_64.tar.gz
            artifacts/ntx-server-linux-aarch64.tar.gz
            artifacts/install.sh
            artifacts/uninstall.sh
          generate_release_notes: true
