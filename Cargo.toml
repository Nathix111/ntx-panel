[workspace]
members = ["ntx-proto", "ntx-server", "ntx-viewer"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["NTX Team"]

[workspace.dependencies]
# gRPC & TLS
tonic = { version = "0.13", features = ["tls-ring"] }
tonic-build = "0.13"
prost = "0.13"
prost-types = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.13"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.5"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# mDNS
mdns-sd = "0.12"

# System info
sysinfo = "0.33"

# Crypto & Auth
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
rand = "0.8"
hex = "0.4"

# Terminal emulation
vt100 = "0.15"

# UUID
uuid = { version = "1", features = ["v4"] }

[workspace.lints.clippy]
result_large_err = "allow"
