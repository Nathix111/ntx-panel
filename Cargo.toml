[workspace]
members = ["ntx-proto", "ntx-server", "ntx-viewer"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["NTX Team"]

[workspace.dependencies]
# gRPC
tonic = "0.13"
tonic-build = "0.13"
prost = "0.13"
prost-types = "0.13"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# mDNS
mdns-sd = "0.12"

# System info
sysinfo = "0.33"

# Crypto (pour PSK hashing)
sha2 = "0.10"
hex = "0.4"

# UUID
uuid = { version = "1", features = ["v4"] }
