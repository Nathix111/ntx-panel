syntax = "proto3";
package ntx;

// === Services ===

service NtxAgent {
    // Authentification (Challenge-Response)
    rpc GetAuthChallenge(AuthChallengeRequest) returns (AuthChallengeResponse);
    rpc Authenticate(AuthRequest) returns (AuthResponse);

    // Monitoring
    rpc GetSystemInfo(Empty) returns (SystemInfo);
    rpc StreamMetrics(MetricsRequest) returns (stream SystemMetrics);

    // Terminal distant
    rpc OpenTerminal(stream TerminalInput) returns (stream TerminalOutput);

    // Health check
    rpc Ping(Empty) returns (PingResponse);

    // Process & Service Management
    rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);
    rpc KillProcess(KillProcessRequest) returns (KillProcessResponse);
    rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
    rpc ControlService(ControlServiceRequest) returns (ControlServiceResponse);

    // Managed Services (supervised by ntx-server with live PTY console)
    rpc ListManagedServices(ListManagedServicesRequest) returns (ListManagedServicesResponse);
    rpc SaveManagedService(SaveManagedServiceRequest) returns (SaveManagedServiceResponse);
    rpc DeleteManagedService(DeleteManagedServiceRequest) returns (DeleteManagedServiceResponse);
    rpc ControlManagedService(ControlManagedServiceRequest) returns (ControlManagedServiceResponse);
    rpc SendManagedServiceInput(SendManagedServiceInputRequest) returns (SendManagedServiceInputResponse);
    rpc StreamManagedServiceConsole(StreamManagedServiceConsoleRequest) returns (stream ConsoleChunk);

    // Docker Container Management
    rpc ListDockerContainers(ListDockerContainersRequest) returns (ListDockerContainersResponse);
    rpc ControlDockerContainer(ControlDockerContainerRequest) returns (ControlDockerContainerResponse);
    rpc ExecDockerCommand(ExecDockerCommandRequest) returns (ExecDockerCommandResponse);
    rpc StreamDockerConsole(stream DockerConsoleInput) returns (stream ConsoleChunk);
}

// === Auth ===

message AuthChallengeRequest {
    string viewer_id = 1;
}

message AuthChallengeResponse {
    string challenge_id = 1;
    bytes nonce = 2;
    uint64 expires_in_seconds = 3;
}

message AuthRequest {
    string psk_hash = 1;      // Legacy/deprecated, non accepté par le serveur
    string viewer_id = 2;     // UUID du viewer
    string challenge_id = 3;  // ID retourné par GetAuthChallenge
    string response_hmac = 4; // HMAC-SHA256(key = SHA256(psk), msg = nonce || ":" || viewer_id) en hex
}

message AuthResponse {
    bool success = 1;
    string session_token = 2;
    string error_message = 3;
    uint64 expires_in_seconds = 4;
}

// === Monitoring ===

message SystemInfo {
    string hostname = 1;
    string os_name = 2;
    string os_version = 3;
    string arch = 4;
    uint64 total_memory_bytes = 5;
    uint32 cpu_count = 6;
    repeated DiskInfo disks = 7;
    repeated NetworkInterface networks = 8;
}

message DiskInfo {
    string name = 1;
    string mount_point = 2;
    uint64 total_bytes = 3;
    uint64 available_bytes = 4;
    string filesystem = 5;
}

message NetworkInterface {
    string name = 1;
    string mac_address = 2;
    repeated string ip_addresses = 3;
}

message MetricsRequest {
    uint32 interval_ms = 1; // Intervalle entre les updates (défaut: 1000ms)
}

message SystemMetrics {
    double cpu_usage_percent = 1;
    uint64 used_memory_bytes = 2;
    uint64 total_memory_bytes = 3;
    repeated DiskMetrics disk_metrics = 4;
    repeated NetworkMetrics network_metrics = 5;
    uint64 timestamp_ms = 6;
}

message DiskMetrics {
    string mount_point = 1;
    uint64 used_bytes = 2;
    uint64 total_bytes = 3;
    uint64 read_bytes_per_sec = 4;
    uint64 write_bytes_per_sec = 5;
}

message NetworkMetrics {
    string interface_name = 1;
    uint64 rx_bytes_per_sec = 2;
    uint64 tx_bytes_per_sec = 3;
}

// === Terminal ===

message TerminalInput {
    oneof input {
        TerminalResize resize = 1;
        bytes data = 2;
    }
}

message TerminalResize {
    uint32 cols = 1;
    uint32 rows = 2;
}

message TerminalOutput {
    bytes data = 1;
}

// === Common ===

message Empty {}

message PingResponse {
    string hostname = 1;
    uint64 uptime_seconds = 2;
    string version = 3;
}

// === Process Management ===

message ProcessItem {
    uint32 pid = 1;
    string name = 2;
    float cpu_usage = 3;
    uint64 memory_bytes = 4;
    string user = 5;
    string status = 6;
    string command_line = 7;
    uint32 parent_pid = 8;
}

message ListProcessesRequest {}

message ListProcessesResponse {
    repeated ProcessItem processes = 1;
}

message KillProcessRequest {
    uint32 pid = 1;
    int32 signal = 2;
}

message KillProcessResponse {
    bool success = 1;
    string error_message = 2;
}

// === Service Management ===

message ServiceItem {
    string name = 1;
    string description = 2;
    string load_state = 3;
    string active_state = 4;
    string sub_state = 5;
}

message ListServicesRequest {}

message ListServicesResponse {
    repeated ServiceItem services = 1;
}

message ControlServiceRequest {
    string service_name = 1;
    string action = 2;
}

message ControlServiceResponse {
    bool success = 1;
    string error_message = 2;
}

// === Shared Live Console Output ===

message ConsoleChunk {
    bytes data = 1;
    uint64 timestamp_ms = 2;
    bool is_history = 3; // true when replaying ring buffer / initial tail
}

// === Managed Services ===

message ManagedServiceConfig {
    string id = 1;
    string name = 2;
    string icon = 3;
    string description = 4;
    string command = 5;
    string working_dir = 6;
    string stop_command = 7;
    bool auto_start = 8;
    bool auto_restart = 9;
    repeated string env_vars = 10;
    repeated string quick_commands = 11;
    string systemd_unit = 12;
    string attach_command = 13;
}

message ManagedServiceStatus {
    ManagedServiceConfig config = 1;
    string state = 2;             // "running", "starting", "stopping", "stopped", "crashed"
    uint32 pid = 3;
    float cpu_usage = 4;
    uint64 memory_bytes = 5;
    uint64 uptime_seconds = 6;
    int32 last_exit_code = 7;
    bool has_exit_code = 8;
    uint32 restart_count = 9;
    string last_error = 10;
}

message ListManagedServicesRequest {}

message ListManagedServicesResponse {
    repeated ManagedServiceStatus services = 1;
}

message SaveManagedServiceRequest {
    ManagedServiceConfig config = 1;
}

message SaveManagedServiceResponse {
    bool success = 1;
    string error_message = 2;
    ManagedServiceConfig service = 3;
}

message DeleteManagedServiceRequest {
    string id = 1;
}

message DeleteManagedServiceResponse {
    bool success = 1;
    string error_message = 2;
}

message ControlManagedServiceRequest {
    string id = 1;
    string action = 2; // "start", "stop", "restart", "kill"
}

message ControlManagedServiceResponse {
    bool success = 1;
    string error_message = 2;
}

message SendManagedServiceInputRequest {
    string id = 1;
    string input = 2;
    bool append_newline = 3;
}

message SendManagedServiceInputResponse {
    bool success = 1;
    string error_message = 2;
}

message StreamManagedServiceConsoleRequest {
    string id = 1;
    uint32 tail_lines = 2;
}

// === Docker Containers ===

message DockerContainerItem {
    string id = 1;
    string name = 2;
    string image = 3;
    string state = 4;             // "running", "exited", "paused", "restarting", "created", "dead"
    string status = 5;
    string ports = 6;
    string created = 7;
    double cpu_percent = 8;
    uint64 memory_used_bytes = 9;
    uint64 memory_limit_bytes = 10;
    string compose_project = 11;
}

message ListDockerContainersRequest {
    bool include_all = 1;
}

message ListDockerContainersResponse {
    bool docker_available = 1;
    string docker_version = 2;
    string error_message = 3;
    repeated DockerContainerItem containers = 4;
}

message ControlDockerContainerRequest {
    string container_id = 1;
    string action = 2; // "start", "stop", "restart", "pause", "unpause", "kill", "remove"
    bool force = 3;
}

message ControlDockerContainerResponse {
    bool success = 1;
    string error_message = 2;
}

message ExecDockerCommandRequest {
    string container_id = 1;
    string command = 2;
}

message ExecDockerCommandResponse {
    bool success = 1;
    int32 exit_code = 2;
    string stdout = 3;
    string stderr = 4;
    string error_message = 5;
}

message DockerConsoleInit {
    string container_id = 1;
    string mode = 2;       // "logs", "attach", "shell"
    uint32 tail_lines = 3;
}

message DockerConsoleInput {
    oneof input {
        DockerConsoleInit init = 1;
        bytes data = 2;
        TerminalResize resize = 3;
    }
}
