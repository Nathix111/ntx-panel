syntax = "proto3";
package ntx;

// === Services ===

service NtxAgent {
    // Authentification
    rpc Authenticate(AuthRequest) returns (AuthResponse);

    // Monitoring
    rpc GetSystemInfo(Empty) returns (SystemInfo);
    rpc StreamMetrics(MetricsRequest) returns (stream SystemMetrics);

    // Terminal distant
    rpc OpenTerminal(stream TerminalInput) returns (stream TerminalOutput);

    // Health check
    rpc Ping(Empty) returns (PingResponse);
}

// === Auth ===

message AuthRequest {
    string psk_hash = 1;  // SHA-256 du PSK
    string viewer_id = 2; // UUID du viewer
}

message AuthResponse {
    bool success = 1;
    string session_token = 2;
    string error_message = 3;
}

// === Monitoring ===

message SystemInfo {
    string hostname = 1;
    string os_name = 2;
    string os_version = 3;
    string arch = 4;
    uint64 total_memory_bytes = 5;
    uint32 cpu_count = 6;
    repeated DiskInfo disks = 7;
    repeated NetworkInterface networks = 8;
}

message DiskInfo {
    string name = 1;
    string mount_point = 2;
    uint64 total_bytes = 3;
    uint64 available_bytes = 4;
    string filesystem = 5;
}

message NetworkInterface {
    string name = 1;
    string mac_address = 2;
    repeated string ip_addresses = 3;
}

message MetricsRequest {
    uint32 interval_ms = 1; // Intervalle entre les updates (défaut: 1000ms)
}

message SystemMetrics {
    double cpu_usage_percent = 1;
    uint64 used_memory_bytes = 2;
    uint64 total_memory_bytes = 3;
    repeated DiskMetrics disk_metrics = 4;
    repeated NetworkMetrics network_metrics = 5;
    uint64 timestamp_ms = 6;
}

message DiskMetrics {
    string mount_point = 1;
    uint64 used_bytes = 2;
    uint64 total_bytes = 3;
    uint64 read_bytes_per_sec = 4;
    uint64 write_bytes_per_sec = 5;
}

message NetworkMetrics {
    string interface_name = 1;
    uint64 rx_bytes_per_sec = 2;
    uint64 tx_bytes_per_sec = 3;
}

// === Terminal ===

message TerminalInput {
    oneof input {
        TerminalResize resize = 1;
        bytes data = 2;
    }
}

message TerminalResize {
    uint32 cols = 1;
    uint32 rows = 2;
}

message TerminalOutput {
    bytes data = 1;
}

// === Common ===

message Empty {}

message PingResponse {
    string hostname = 1;
    uint64 uptime_seconds = 2;
    string version = 3;
}
